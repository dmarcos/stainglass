<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lead &amp; Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css?v=202610261900">
</head>
<body>
<canvas id="gl" tabindex="0" aria-label="3D view of a stained glass window in a room"></canvas>
<div id="markers"></div>
<aside id="panel">
  <header class="brand">
    <svg width="26" height="40" viewBox="0 0 26 40" aria-hidden="true"><path d="M2 39V17Q2 6 13 1Q24 6 24 17V39Z" fill="#1d3a8f" stroke="#d6ab5e" stroke-width="1.6"/><path d="M2 26H24M13 1V39M7 17H19" stroke="#d6ab5e" stroke-width="1.2" fill="none"/><circle cx="13" cy="21" r="3.2" fill="#a3121e" stroke="#d6ab5e" stroke-width="1"/></svg>
    <div><h1>Lead &amp; Light</h1><p>Seven landmark windows, rebuilt in glass and lead</p></div>
  </header>
  <nav id="styles" role="tablist" aria-label="Period and style"></nav>
  <section id="info" aria-live="polite">
    <div class="era" id="era"></div>
    <h2 id="sname"></h2>
    <p class="blurb" id="blurb"></p>
    <dl class="facts" id="facts"></dl>
    <figure id="src"><img id="srcimg" alt="" width="96" height="140"><figcaption><b id="wtitle"></b><span id="wmeta"></span><span class="credit" id="credit"></span></figcaption></figure>
    <h3>Glass in this window</h3>
    <div id="swatches"></div>
    <p id="gtypes"></p>
    <h3>Hallmarks · select to inspect</h3>
    <ol id="hallmarks"></ol>
  </section>
</aside>
<div id="tools">
  <div class="chip"><label for="tod">Light</label><input type="range" id="tod" min="0" max="1" step="0.001" value="0.2"><span id="todv">Morning</span></div>
  <button class="chip" id="beams" aria-pressed="true">Light shafts</button>
  <button class="chip" id="overview">Overview</button>
</div>
<div id="process">
  <p id="caption"></p>
  <div class="bar">
    <button id="play" aria-label="Play the making of this window"><svg width="10" height="12" viewBox="0 0 10 12" aria-hidden="true"><path d="M0 0L10 6L0 12Z" fill="currentColor"/></svg><span>Watch it made</span></button>
    <ol id="steps"></ol>
  </div>
</div>
<div id="loading">Cutting glass…</div>
<div id="err"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module" src="main.js?v=202610261900"></script>
</body>
</html>
